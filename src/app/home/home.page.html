<ion-content [fullscreen]="true" class="welcome-bg">
  <div class="welcome-container">

    <!-- Logo and Name Area -->
    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="restaurant"></ion-icon>
      </div>
      <h1 class="app-title">Salo Kusina</h1>
      <p class="app-subtitle">Taste of Home, Anywhere</p>
    </div>

    <!-- Greeting / Tagline -->
    <div class="intro-section">
      <h2>Feeling hungry?</h2>
      <p>Discover and cook your favorite Filipino dishes. Join our community today!</p>
    </div>
     <!-- Buttons for guests without an account -->
    <div class="action-buttons">
      <ion-button expand="block" class="signin-btn" [routerLink]="['/login']">
        SIGN IN
      </ion-button>

      <ion-button expand="block" fill="outline" class="signup-btn" [routerLink]="['/register']">
        CREATE AN ACCOUNT
      </ion-button>
    </div>


    <!-- An icon or footer design could also go here -->
    <div class="welcome-footer">
      <p>By continuing, you agree to our Terms & Conditions</p>
    </div>

  </div>
</ion-content>
